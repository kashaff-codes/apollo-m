# Scrape targets for the hosted stack: the two deployed APIs, over HTTPS.
#
# 30 s, not the usual 15 s: both APIs run on Render's free tier, and a scrape is
# inbound traffic that keeps them awake. Twice a minute is plenty for series that
# change when the pipeline runs, and it halves the wake-ups.
global:
  scrape_interval: 30s
  scrape_timeout: 25s        # a sleeping free-tier service can take ~20 s to wake
  external_labels:
    stack: apollo-m-hosted

scrape_configs:
  - job_name: apollo-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["apollo-api-tllm.onrender.com"]
        labels: {system: apollo}

  - job_name: cerebro-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["cerebro-api-nmah.onrender.com"]
        labels: {system: cerebro}

  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
