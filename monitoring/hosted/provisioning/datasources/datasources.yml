apiVersion: 1

datasources:
  # Live operational series, scraped from the deployed APIs.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090/prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s

  # The committed corpus outputs, read from GitHub. These are the same files the
  # dashboard and API serve, so the history panels show real data from the first
  # second — Prometheus on a diskless free tier only has what it scraped since
  # it last woke.
  - name: Corpus (GitHub)
    uid: corpus
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: false
    jsonData:
      allowedHosts:
        - https://raw.githubusercontent.com
